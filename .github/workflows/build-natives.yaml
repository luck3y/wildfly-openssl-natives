name: Build Natives
on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - '*'
jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: main
    strategy:
      matrix:
        os: [macos-latest]
        java: ['21']
    steps:
      - uses: actions/checkout@v3
        with:
          path: main
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}
      - name: Checkout wildfly-openssl for test purposes
        uses: actions/checkout@v3
        with:
          repository: wildfly-security/wildfly-openssl
          path: wildfly-openssl
      - if: matrix.os == 'macos-latest'
        name: OpenSSL Library Version Info on MacOS
        run: |
          OPENSSL_VERSION=$(ls -t1 /opt/homebrew/Cellar/openssl@3* | head -1)
          OPENSSL_PATH=/opt/homebrew/Cellar/openssl@3/${OPENSSL_VERSION}/bin
          echo OpenSSL Located at: ${OPENSSL_PATH}
          export PATH="${OPENSSL_PATH}:${PATH}"
          openssl version
      - name: Maven Version Info
        run: mvn -version
      - if: matrix.os == 'macos-latest'
        name: Build WildFly OpenSSL natives on MacOS
        id: build-wildfly-openssl-natives
        run: |
          OPENSSL_VERSION=$(ls -t1 /opt/homebrew/Cellar/openssl@3* | head -1)
          OPENSSL_PATH=/opt/homebrew/Cellar/openssl@3/${OPENSSL_VERSION}/bin
          echo OpenSSL Located at: ${OPENSSL_PATH}
          export PATH="${OPENSSL_PATH}:${PATH}"
          echo "OpenSSL version used is:"
          openssl version
          which openssl
          cd macosx-x86_64 
          make || true
          ls -lR target/classes
          cd ..
          pwd
          mvn --version
          echo "WILDFLY_OPENSSL_NATIVES_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT
          mvn -B install --file pom.xml
          echo WFN: ${WILDFLY_OPENSSL_NATIVES_VERSION}
      - if: matrix.os == 'macos-latest'
        name: Run tests with the built MacOS native
        working-directory: wildfly-openssl
        run: |
          echo WFN1: ${WILDFLY_OPENSSL_NATIVES_VERSION}
          OPENSSL_VERSION=$(ls -t1 /opt/homebrew/Cellar/openssl@3* | head -1)
          OPENSSL_PATH=/opt/homebrew/Cellar/openssl@3/${OPENSSL_VERSION}
          echo OpenSSL Located at: ${OPENSSL_PATH}
          export PATH="${OPENSSL_PATH}/bin:${PATH}"
          openssl version
          export WILDFLY_OPENSSL_NATIVES_VERSION=${{ steps.build-wildfly-openssl-natives.outputs.WILDFLY_OPENSSL_NATIVES_VERSION }}
          echo Running tests with WildFly OpenSSL Natives $WILDFLY_OPENSSL_NATIVES_VERSION
          mvn -B verify --file pom.xml -Dorg.wildfly.openssl.path="${OPENSSL_PATH}/lib" -Dversion.org.wildfly.openssl.natives=$WILDFLY_OPENSSL_NATIVES_VERSION
